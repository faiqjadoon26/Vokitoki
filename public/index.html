<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VokiToki</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #2a2a2a 0%, #0a0a0a 100%);
            padding: 16px;
        }

        .radio {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
            border-radius: 40px 40px 32px 32px;
            padding: 24px 20px 28px;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.05),
                0 0 0 2px #3a3a3a;
            border: 1px solid #4a4a4a;
            position: relative;
        }

        /* Antenna */
        .radio::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 50px;
            background: linear-gradient(to top, #4a4a4a, #6a6a6a);
            border-radius: 4px 4px 0 0;
            box-shadow: 0 -4px 10px rgba(100,100,100,0.3);
        }
        
        .radio::after {
            content: '';
            position: absolute;
            top: -56px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 10px;
            background: radial-gradient(ellipse, #6a6a6a, #3a3a3a);
            border-radius: 50%;
            box-shadow: 0 -2px 8px rgba(100,100,100,0.2);
        }

        /* Top LED indicators */
        .leds {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 16px;
        }
        
        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            transition: 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .led.power {
            background: #22c55e;
            box-shadow: 0 0 12px rgba(34,197,94,0.3), inset 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .led.tx {
            background: #ef4444;
            box-shadow: 0 0 12px rgba(239,68,68,0.3), inset 0 2px 4px rgba(0,0,0,0.3);
            animation: blink 0.5s infinite;
        }
        
        .led.rx {
            background: #3b82f6;
            box-shadow: 0 0 12px rgba(59,130,246,0.3), inset 0 2px 4px rgba(0,0,0,0.3);
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Speaker grille */
        .speaker {
            background: radial-gradient(ellipse at center, #1a1a1a, #0a0a0a);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #3a3a3a;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.6);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .speaker-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 300px;
        }
        
        .speaker-grid span {
            height: 8px;
            background: #2a2a2a;
            border-radius: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        
        .speaker-grid span:nth-child(odd) {
            background: #222;
        }

        /* Channel display */
        .display {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.8);
            font-family: 'Courier New', monospace;
            min-height: 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .display .channel {
            color: #4ade80;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(74,222,128,0.1);
        }
        
        .display .status {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        
        .display .status.connected {
            color: #4ade80;
        }
        
        .display .status.recording {
            color: #ef4444;
            animation: pulse-text 0.5s infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .controls input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid #2a2a2a;
            background: #0a0a0a;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        
        .controls input:focus {
            border-color: #3b82f6;
        }
        
        .controls button {
            padding: 10px 16px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            background: #2a2a2a;
            color: #94a3b8;
            border: 1px solid #3a3a3a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
        
        .controls button:active {
            transform: scale(0.95);
        }
        
        .controls button.host {
            background: #d97706;
            color: #fff;
            border-color: #f59e0b;
        }
        
        .controls button.join {
            background: #059669;
            color: #fff;
            border-color: #10b981;
        }
        
        .controls button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* Mode switch */
        .mode-switch {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background: #0a0a0a;
            padding: 4px;
            border-radius: 30px;
            border: 1px solid #1a1a1a;
        }
        
        .mode-switch button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
            color: #4a5568;
            letter-spacing: 0.5px;
        }
        
        .mode-switch button.active {
            background: #2563eb;
            color: #fff;
        }
        
        .mode-switch button:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

        /* Users */
        .users {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 0;
            min-height: 32px;
            align-items: center;
            justify-content: center;
        }
        
        .user-tag {
            background: #1e2a3a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #94a3b8;
            border: 1px solid #2a3348;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .user-tag.host {
            background: #7f1d1d;
            border-color: #ef4444;
            color: #fca5a5;
        }
        
        .user-tag.you {
            background: #1e3a3a;
            border-color: #22c55e;
            color: #86efac;
        }
        
        .user-tag .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .user-tag .dot.online {
            background: #22c55e;
        }

        /* PTT Button */
        .ptt-container {
            margin: 12px 0 8px;
        }
        
        .ptt-btn {
            width: 100%;
            padding: 24px;
            border: none;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.15s;
            background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
            color: #94a3b8;
            border: 2px solid #3a3a3a;
            box-shadow: 
                0 8px 24px rgba(0,0,0,0.4),
                inset 0 2px 0 rgba(255,255,255,0.05);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .ptt-btn:active {
            transform: scale(0.97);
        }
        
        .ptt-btn.active {
            background: linear-gradient(180deg, #7f1d1d, #4a0a0a);
            border-color: #ef4444;
            color: #fca5a5;
            box-shadow: 
                0 8px 24px rgba(239,68,68,0.2),
                inset 0 2px 0 rgba(255,255,255,0.1);
        }
        
        .ptt-btn.active .ptt-icon {
            animation: pulse-ptt 0.3s infinite;
        }
        
        .ptt-btn .ptt-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 4px;
        }
        
        .ptt-btn .ptt-label {
            font-size: 14px;
        }
        
        @keyframes pulse-ptt {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Voice level meter */
        .meter {
            height: 4px;
            background: #1a1a1a;
            border-radius: 4px;
            margin: 8px 0 12px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
        }
        
        .meter .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            transition: width 0.1s;
            border-radius: 4px;
        }

        /* Channel ID display */
        .channel-id {
            text-align: center;
            color: #4ade80;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            padding: 4px 0;
            letter-spacing: 1px;
        }

        .channel-id .label {
            color: #4a5568;
        }

        /* Status messages */
        .status-msg {
            text-align: center;
            color: #4a5568;
            font-size: 11px;
            padding: 6px 0;
            font-family: 'Courier New', monospace;
        }

        .status-msg.active {
            color: #4ade80;
        }

        .status-msg.recording {
            color: #ef4444;
            animation: pulse-text 0.5s infinite;
        }

        /* Disconnect button */
        .disconnect-btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            background: #2a2a2a;
            color: #4a5568;
            border: 1px solid #3a3a3a;
            margin-top: 8px;
        }
        
        .disconnect-btn:active {
            transform: scale(0.95);
        }
        
        .disconnect-btn.active {
            background: #7f1d1d;
            color: #fca5a5;
            border-color: #b91c1c;
        }
    </style>
</head>
<body>

<div class="radio">
    <!-- LEDs -->
    <div class="leds">
        <div class="led power" id="powerLed"></div>
        <div class="led" id="txLed"></div>
        <div class="led" id="rxLed"></div>
    </div>

    <!-- Speaker Grille -->
    <div class="speaker">
        <div class="speaker-grid">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- Display -->
    <div class="display">
        <div class="channel" id="channelDisplay">CH: ---</div>
        <div class="status" id="statusDisplay">STANDBY</div>
    </div>

    <!-- Mode Switch -->
    <div class="mode-switch">
        <button class="active" data-mode="host">👑 HOST</button>
        <button data-mode="join">🔗 JOIN</button>
    </div>

    <!-- Host Mode -->
    <div id="hostMode">
        <div class="controls">
            <input type="text" id="hostRoomInput" placeholder="Channel name" value="campfire">
            <button class="host" id="hostBtn">HOST</button>
        </div>
    </div>

    <!-- Join Mode -->
    <div id="joinMode" class="hidden">
        <div class="controls">
            <input type="text" id="joinRoomInput" placeholder="Enter channel ID">
            <button class="join" id="joinBtn">JOIN</button>
        </div>
    </div>

    <!-- Channel ID Display -->
    <div id="channelIdDisplay" class="channel-id hidden">
        <span class="label">📡 CHANNEL:</span> <span id="channelIdText"></span>
    </div>

    <!-- Users -->
    <div class="users" id="userList">
        <span style="color:#4a5568; font-size:11px;">No users online</span>
    </div>

    <!-- Status Message -->
    <div class="status-msg" id="statusMsg">🔌 Press HOST or JOIN to start</div>

    <!-- PTT Button -->
    <div class="ptt-container">
        <button class="ptt-btn" id="voiceBtn" disabled>
            <span class="ptt-icon">🎤</span>
            <span class="ptt-label">HOLD TO TALK</span>
        </button>
    </div>

    <!-- Meter -->
    <div class="meter">
        <div class="fill" id="voiceLevel"></div>
    </div>

    <!-- Disconnect -->
    <button class="disconnect-btn" id="disconnectBtn" disabled>LEAVE CHANNEL</button>
</div>

<script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
<script>
    (function() {
        'use strict';

        // ---- DOM refs ----
        const statusDisplay = document.getElementById('statusDisplay');
        const channelDisplay = document.getElementById('channelDisplay');
        const powerLed = document.getElementById('powerLed');
        const txLed = document.getElementById('txLed');
        const rxLed = document.getElementById('rxLed');
        const userList = document.getElementById('userList');
        const voiceBtn = document.getElementById('voiceBtn');
        const voiceLevel = document.getElementById('voiceLevel');
        const statusMsg = document.getElementById('statusMsg');
        const disconnectBtn = document.getElementById('disconnectBtn');

        const hostMode = document.getElementById('hostMode');
        const joinMode = document.getElementById('joinMode');
        const hostRoomInput = document.getElementById('hostRoomInput');
        const joinRoomInput = document.getElementById('joinRoomInput');
        const hostBtn = document.getElementById('hostBtn');
        const joinBtn = document.getElementById('joinBtn');
        const channelIdDisplay = document.getElementById('channelIdDisplay');
        const channelIdText = document.getElementById('channelIdText');

        const modeButtons = document.querySelectorAll('[data-mode]');

        // ---- State ----
        let socket = null;
        let isConnected = false;
        let isRecording = false;
        let audioContext = null;
        let mediaStream = null;
        let analyser = null;
        let dataArray = null;
        let animationFrame = null;
        let mediaRecorder = null;
        let voiceChunks = [];
        let room = null;
        let myRole = null;
        let users = [];

        // ---- Get device ID ----
        function getDeviceId() {
            let id = localStorage.getItem('vokitoki_device_id');
            if (!id) {
                id = 'User-' + Math.random().toString(36).substring(2, 7);
                localStorage.setItem('vokitoki_device_id', id);
            }
            return id;
        }

        const deviceId = getDeviceId();

        // ---- Set status ----
        function setStatus(text, connected = false, role = null) {
            statusDisplay.textContent = text;
            statusDisplay.className = 'status';
            if (connected) statusDisplay.classList.add('connected');
            if (text === 'RECORDING') statusDisplay.classList.add('recording');

            isConnected = connected;
            voiceBtn.disabled = !connected;
            hostBtn.disabled = connected;
            joinBtn.disabled = connected;
            hostRoomInput.disabled = connected;
            joinRoomInput.disabled = connected;
            disconnectBtn.disabled = !connected;

            if (connected) {
                powerLed.className = 'led power';
                disconnectBtn.classList.add('active');
                disconnectBtn.textContent = 'LEAVE CHANNEL';
            } else {
                powerLed.className = 'led';
                disconnectBtn.classList.remove('active');
                disconnectBtn.textContent = 'LEAVE CHANNEL';
            }

            if (role === 'host') {
                myRole = 'host';
            } else if (role === 'joiner') {
                myRole = 'joiner';
            } else {
                myRole = null;
            }

            // Update status message
            if (connected && role === 'host') {
                statusMsg.textContent = '👑 You are hosting. Share the channel ID!';
                statusMsg.className = 'status-msg active';
            } else if (connected && role === 'joiner') {
                statusMsg.textContent = '🔗 Connected to channel. Press PTT to talk.';
                statusMsg.className = 'status-msg active';
            } else if (connected) {
                statusMsg.textContent = '📡 Connected. Press PTT to talk.';
                statusMsg.className = 'status-msg active';
            } else {
                statusMsg.textContent = '🔌 Press HOST or JOIN to start';
                statusMsg.className = 'status-msg';
            }
        }

        // ---- Update user list ----
        function updateUsers(userListData, hostId) {
            users = userListData || [];
            const currentId = deviceId;

            if (users.length === 0) {
                userList.innerHTML = '<span style="color:#4a5568; font-size:11px;">No users online</span>';
            } else {
                userList.innerHTML = '';
                users.forEach(id => {
                    const isYou = id === currentId;
                    const isHost = id === hostId;
                    let cls = 'user-tag';
                    if (isYou) cls += ' you';
                    if (isHost) cls += ' host';
                    const dot = document.createElement('span');
                    dot.className = 'dot online';
                    const label = document.createTextNode(isYou ? ' You' : (isHost ? ' 👑 ' + id : ' 📱 ' + id));
                    const tag = document.createElement('span');
                    tag.className = cls;
                    tag.appendChild(dot);
                    tag.appendChild(label);
                    userList.appendChild(tag);
                });
            }
        }

        // ---- Connect to server ----
        function connectSocket() {
            const SERVER_URL = window.location.origin;

            try {
                socket = io(SERVER_URL, {
                    transports: ['websocket', 'polling'],
                    reconnection: true,
                    reconnectionAttempts: 10,
                    reconnectionDelay: 1000,
                });

                socket.on('connect', () => {
                    setStatus('READY', true);
                });

                socket.on('connect_error', (err) => {
                    setStatus('ERROR', false);
                    statusMsg.textContent = '❌ Connection error: ' + err.message;
                    statusMsg.className = 'status-msg';
                });

                socket.on('disconnect', () => {
                    setStatus('OFFLINE', false);
                    socket = null;
                    updateUsers([], null);
                    channelDisplay.textContent = 'CH: ---';
                    statusMsg.textContent = '🔌 Disconnected';
                    statusMsg.className = 'status-msg';
                });

            } catch (err) {
                statusMsg.textContent = '❌ Error: ' + err.message;
                statusMsg.className = 'status-msg';
            }
        }

        // ---- Host a channel ----
        hostBtn.addEventListener('click', function() {
            if (!socket) connectSocket();

            const channelName = hostRoomInput.value.trim() || 'campfire';
            room = channelName;

            statusMsg.textContent = '👑 Creating channel...';
            statusMsg.className = 'status-msg active';

            socket.emit('hostChannel', channelName, deviceId, (response) => {
                if (response && response.success) {
                    channelDisplay.textContent = 'CH: ' + channelName;
                    setStatus('HOST', true, 'host');
                    channelIdDisplay.classList.remove('hidden');
                    channelIdText.textContent = channelName;
                    statusMsg.textContent = '👑 Channel created! Share: ' + channelName;
                    statusMsg.className = 'status-msg active';
                    setupChannelListeners();
                } else {
                    statusMsg.textContent = '❌ ' + (response.error || 'Failed to host');
                    statusMsg.className = 'status-msg';
                    channelDisplay.textContent = 'CH: ---';
                }
            });
        });

        // ---- Join a channel ----
        joinBtn.addEventListener('click', function() {
            if (!socket) connectSocket();

            const channelName = joinRoomInput.value.trim();
            if (!channelName) {
                statusMsg.textContent = '⚠️ Enter a channel ID';
                statusMsg.className = 'status-msg';
                return;
            }

            room = channelName;
            statusMsg.textContent = '🔗 Joining...';
            statusMsg.className = 'status-msg active';

            socket.emit('joinChannel', channelName, deviceId, (response) => {
                if (response && response.success) {
                    channelDisplay.textContent = 'CH: ' + channelName;
                    setStatus('JOINED', true, 'joiner');
                    if (response.users) {
                        updateUsers(response.users, response.host);
                    }
                    statusMsg.textContent = '🔗 Connected to ' + channelName;
                    statusMsg.className = 'status-msg active';
                    setupChannelListeners();
                } else {
                    statusMsg.textContent = '❌ ' + (response.error || 'Failed to join');
                    statusMsg.className = 'status-msg';
                    channelDisplay.textContent = 'CH: ---';
                }
            });
        });

        // ---- Setup channel event listeners ----
        function setupChannelListeners() {
            socket.on('userJoined', (data) => {
                updateUsers(data.users, data.hostId);
                rxLed.className = 'led rx';
                setTimeout(() => { rxLed.className = 'led'; }, 300);
            });

            socket.on('userLeft', (data) => {
                updateUsers(data.users, data.hostId);
            });

            socket.on('voice', (data) => {
                if (data.sender === deviceId) return;
                rxLed.className = 'led rx';
                setTimeout(() => { rxLed.className = 'led'; }, 500);
                playVoice(data.audio);
            });

            socket.on('channelDestroyed', (msg) => {
                statusMsg.textContent = '💥 ' + msg;
                statusMsg.className = 'status-msg';
                setStatus('CHANNEL CLOSED', false);
                socket = null;
                updateUsers([], null);
                channelDisplay.textContent = 'CH: ---';
                channelIdDisplay.classList.add('hidden');
            });
        }

        // ---- Voice recording ----
        async function startRecording() {
            try {
                setStatus('RECORDING', true, myRole);
                voiceBtn.classList.add('active');
                voiceBtn.innerHTML = '<span class="ptt-icon">🔴</span><span class="ptt-label">RELEASE TO SEND</span>';
                txLed.className = 'led tx';
                statusMsg.textContent = '🎤 Recording... speak now!';
                statusMsg.className = 'status-msg recording';

                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 16000,
                        channelCount: 1
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(mediaStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.fftSize);

                mediaRecorder = new MediaRecorder(mediaStream, {
                    mimeType: 'audio/webm;codecs=opus'
                });

                voiceChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        voiceChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    if (voiceChunks.length > 0) {
                        const blob = new Blob(voiceChunks, { type: 'audio/webm' });
                        if (blob.size > 100) {
                            const reader = new FileReader();
                            reader.onload = () => {
                                const base64 = reader.result;
                                if (socket && isConnected) {
                                    socket.emit('sendVoice', { audio: base64 });
                                    txLed.className = 'led tx';
                                    setTimeout(() => { txLed.className = 'led'; }, 300);
                                }
                            };
                            reader.readAsDataURL(blob);
                        }
                    }
                    voiceChunks = [];
                };

                mediaRecorder.start(100);
                isRecording = true;
                updateLevel();

            } catch (err) {
                statusMsg.textContent = '❌ Mic error: ' + err.message;
                statusMsg.className = 'status-msg';
                setStatus('MIC ERROR', true, myRole);
                voiceBtn.classList.remove('active');
                voiceBtn.innerHTML = '<span class="ptt-icon">🎤</span><span class="ptt-label">HOLD TO TALK</span>';
                txLed.className = 'led';
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }

            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            isRecording = false;
            voiceBtn.classList.remove('active');
            voiceBtn.innerHTML = '<span class="ptt-icon">🎤</span><span class="ptt-label">HOLD TO TALK</span>';
            voiceLevel.style.width = '0%';
            txLed.className = 'led';
            if (isConnected) {
                setStatus(myRole === 'host' ? 'HOST' : 'JOINED', true, myRole);
                statusMsg.textContent = myRole === 'host' ? '👑 Hosting ' + room : '🔗 Connected to ' + room;
                statusMsg.className = 'status-msg active';
            }
        }

        function updateLevel() {
            if (!analyser || !isRecording) return;

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const avg = sum / dataArray.length;
            const percent = Math.min((avg / 128) * 100, 100);
            voiceLevel.style.width = percent + '%';

            animationFrame = requestAnimationFrame(updateLevel);
        }

        // ---- Voice button events ----
        voiceBtn.addEventListener('mousedown', async (e) => {
            e.preventDefault();
            if (!isRecording && isConnected) {
                await startRecording();
            }
        });

        voiceBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });

        voiceBtn.addEventListener('mouseleave', (e) => {
            if (isRecording) {
                stopRecording();
            }
        });

        voiceBtn.addEventListener('touchstart', async (e) => {
            e.preventDefault();
            if (!isRecording && isConnected) {
                await startRecording();
            }
        });

        voiceBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });

        voiceBtn.addEventListener('touchcancel', (e) => {
            if (isRecording) {
                stopRecording();
            }
        });

        // ---- Play voice ----
        function playVoice(base64Data) {
            try {
                if (!base64Data || typeof base64Data !== 'string') return;
                if (!base64Data.startsWith('data:audio/webm')) {
                    if (base64Data.startsWith('data:')) {
                        // It's a data URL but maybe wrong type
                    } else {
                        base64Data = 'data:audio/webm;base64,' + base64Data;
                    }
                }

                const audio = new Audio();
                audio.src = base64Data;
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {});
                }
            } catch (err) {}
        }

        // ---- Disconnect ----
        disconnectBtn.addEventListener('click', function() {
            if (socket) {
                socket.emit('leaveChannel');
                socket.disconnect();
                socket = null;
            }
            setStatus('DISCONNECTED', false);
            updateUsers([], null);
            channelDisplay.textContent = 'CH: ---';
            channelIdDisplay.classList.add('hidden');
            statusMsg.textContent = '🔌 Left the channel';
            statusMsg.className = 'status-msg';
        });

        // ---- Mode switching ----
        modeButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                modeButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const mode = this.dataset.mode;
                if (mode === 'host') {
                    hostMode.classList.remove('hidden');
                    joinMode.classList.add('hidden');
                } else {
                    hostMode.classList.add('hidden');
                    joinMode.classList.remove('hidden');
                }

                if (isConnected) {
                    statusMsg.textContent = '⚠️ Leave channel to switch mode';
                    statusMsg.className = 'status-msg';
                }
            });
        });

        // ---- Init ----
        statusMsg.textContent = '🔌 Press HOST or JOIN to start';
        statusMsg.className = 'status-msg';

        // Connect socket immediately
        connectSocket();

        // ---- Handle page close ----
        window.addEventListener('beforeunload', function() {
            if (socket) {
                socket.emit('leaveChannel');
                socket.disconnect();
            }
            if (isRecording) {
                stopRecording();
            }
        });

    })();
</script>
</body>
</html>
