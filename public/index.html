<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>VokiToki – Host/Join</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            max-width: 500px;
            margin: 2rem auto;
            padding: 1.5rem;
        }
        .card {
            background: #1a1f2a;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid #2e3748;
            margin-bottom: 1.2rem;
        }
        h1 { font-size: 1.8rem; margin-bottom: 0.2rem; }
        .sub { color: #8892a8; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin: 0.5rem 0; }
        input {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            border: 1px solid #2e3748;
            background: #0f141e;
            color: #e8edf5;
            font-size: 1rem;
            min-width: 120px;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 2rem;
            font-weight: 600;
            background: #2a3348;
            color: #c8d0e0;
            cursor: pointer;
            border: 1px solid #3a445a;
            transition: 0.15s;
        }
        button:active { transform: scale(0.96); }
        button.primary { background: #2563eb; color: #fff; border-color: #3b82f6; }
        button.danger { background: #7f1d1d; border-color: #b91c1c; color: #fca5a5; }
        button.success { background: #059669; color: #fff; border-color: #10b981; }
        button.warning { background: #d97706; color: #fff; border-color: #f59e0b; }
        button:disabled { opacity: 0.4; pointer-events: none; }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: #1e2a3a;
            color: #94a3b8;
        }
        .badge.on { background: #1e3a3a; color: #34d399; }
        .badge.host { background: #7f1d1d; color: #fca5a5; }
        .badge.recording { background: #7f1d1d; color: #fca5a5; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #log {
            background: #0f141e;
            padding: 0.8rem;
            border-radius: 1rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #1e2638;
            margin-top: 0.5rem;
        }
        hr { border: 0; border-top: 1px solid #1e2638; margin: 0.8rem 0; }
        .voice-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }
        .voice-indicator .bar {
            flex: 1;
            height: 4px;
            background: #1e2638;
            border-radius: 2px;
            overflow: hidden;
        }
        .voice-indicator .bar .fill {
            height: 100%;
            background: #22c55e;
            width: 0%;
            transition: width 0.1s;
        }
        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin: 0.5rem 0;
        }
        .user-tag {
            background: #1e2a3a;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            color: #94a3b8;
            border: 1px solid #2a3348;
        }
        .user-tag.active { border-color: #22c55e; color: #86efac; }
        .user-tag.host { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
        .user-tag.you { background: #1e3a3a; border-color: #22c55e; color: #86efac; }
        .mode-selector {
            display: flex;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }
        .mode-selector button {
            flex: 1;
            padding: 0.8rem;
            border-radius: 1rem;
            border: 2px solid #2a3348;
            background: transparent;
            color: #8892a8;
            font-weight: 600;
        }
        .mode-selector button.active {
            border-color: #2563eb;
            color: #60a5fa;
            background: #1a2a4a;
        }
        .share-id {
            background: #0f141e;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            font-family: monospace;
            font-size: 1.1rem;
            border: 1px solid #2563eb;
            text-align: center;
            margin: 0.5rem 0;
            word-break: break-all;
        }
    </style>
</head>
<body>

<h1>📡 VokiToki</h1>
<div class="sub">Host or Join a voice channel</div>

<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span><span class="badge" id="statusBadge">⏸ idle</span></span>
        <span id="roleBadge" style="color:#8892a8; font-size:0.85rem;"></span>
    </div>

    <!-- Mode Selector -->
    <div class="mode-selector">
        <button class="active" data-mode="host">👑 Host</button>
        <button data-mode="join">🔗 Join</button>
    </div>

    <!-- Host Mode -->
    <div id="hostMode">
        <div class="row">
            <input id="hostRoomInput" placeholder="Channel name" value="campfire" />
            <button class="primary" id="hostBtn">👑 Host Channel</button>
        </div>
        <div class="share-id" id="hostChannelDisplay" style="display:none;">
            📢 Share this channel ID: <span id="channelIdDisplay"></span>
        </div>
    </div>

    <!-- Join Mode -->
    <div id="joinMode" style="display:none;">
        <div class="row">
            <input id="joinRoomInput" placeholder="Enter channel ID to join" />
            <button class="success" id="joinBtn">🔗 Join Channel</button>
        </div>
    </div>

    <hr />

    <div class="user-list" id="userList">
        <span style="color:#4a5568; font-size:0.8rem;">No users in channel</span>
    </div>

    <!-- Text Chat -->
    <div class="row">
        <input id="msgInput" placeholder="Type a message..." maxlength="140" />
        <button class="primary" id="sendBtn" disabled>Send</button>
    </div>

    <!-- Voice Controls -->
    <div class="voice-indicator">
        <button class="success" id="voiceBtn" style="flex:1; padding:0.8rem; font-size:1.1rem;" disabled>
            🎤 Hold to Talk
        </button>
    </div>
    <div class="voice-indicator">
        <span style="font-size:0.75rem; color:#4a5568;">Voice level</span>
        <div class="bar">
            <div class="fill" id="voiceLevel"></div>
        </div>
    </div>

    <div id="log">💡 Choose Host or Join mode above.</div>
</div>

<script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
<script>
    (function() {
        'use strict';

        // ---- DOM refs ----
        const logEl = document.getElementById('log');
        const statusBadge = document.getElementById('statusBadge');
        const roleBadge = document.getElementById('roleBadge');
        const userList = document.getElementById('userList');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const voiceLevel = document.getElementById('voiceLevel');

        const hostMode = document.getElementById('hostMode');
        const joinMode = document.getElementById('joinMode');
        const hostRoomInput = document.getElementById('hostRoomInput');
        const joinRoomInput = document.getElementById('joinRoomInput');
        const hostBtn = document.getElementById('hostBtn');
        const joinBtn = document.getElementById('joinBtn');
        const hostChannelDisplay = document.getElementById('hostChannelDisplay');
        const channelIdDisplay = document.getElementById('channelIdDisplay');

        const modeButtons = document.querySelectorAll('[data-mode]');

        // ---- State ----
        let socket = null;
        let isConnected = false;
        let isRecording = false;
        let audioContext = null;
        let mediaStream = null;
        let analyser = null;
        let dataArray = null;
        let animationFrame = null;
        let mediaRecorder = null;
        let voiceChunks = [];
        let room = null;
        let myRole = null;
        let users = [];

        // ---- Get device ID ----
        function getDeviceId() {
            let id = localStorage.getItem('vokitoki_device_id');
            if (!id) {
                id = 'User-' + Math.random().toString(36).substring(2, 7);
                localStorage.setItem('vokitoki_device_id', id);
            }
            return id;
        }

        const deviceId = getDeviceId();

        // ---- Log helper ----
        function appendLog(msg) {
            const ts = new Date().toLocaleTimeString();
            logEl.textContent += `[${ts}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // ---- Set status ----
        function setStatus(text, connected = false, role = null) {
            statusBadge.textContent = connected ? '● connected' : '⏸ offline';
            statusBadge.className = 'badge' + (connected ? ' on' : '');
            isConnected = connected;
            sendBtn.disabled = !connected;
            voiceBtn.disabled = !connected;
            hostBtn.disabled = connected;
            joinBtn.disabled = connected;
            hostRoomInput.disabled = connected;
            joinRoomInput.disabled = connected;

            if (role === 'host') {
                roleBadge.textContent = '👑 Host';
                roleBadge.style.color = '#fca5a5';
            } else if (role === 'joiner') {
                roleBadge.textContent = '🔗 Joiner';
                roleBadge.style.color = '#86efac';
            } else {
                roleBadge.textContent = '';
            }
            myRole = role;
        }

        // ---- Update user list ----
        function updateUsers(userListData, hostId) {
            users = userListData || [];
            const currentId = deviceId;
            const filtered = users.filter(id => id !== currentId);

            if (users.length === 0) {
                userList.innerHTML = '<span style="color:#4a5568; font-size:0.8rem;">No users in channel</span>';
            } else {
                let html = '';
                users.forEach(id => {
                    const isYou = id === currentId;
                    const isHost = id === hostId;
                    let cls = 'user-tag';
                    if (isYou) cls += ' you';
                    if (isHost) cls += ' host';
                    if (!isYou && !isHost) cls += ' active';
                    const label = isYou ? 'You' : (isHost ? '👑 ' + id : '📱 ' + id);
                    html += `<span class="${cls}">${label}</span>`;
                });
                userList.innerHTML = html;
            }
        }

        // ---- Connect to server ----
        function connectSocket() {
            const SERVER_URL = window.location.origin;
            appendLog(`🔗 Connecting to ${SERVER_URL}...`);

            try {
                socket = io(SERVER_URL, {
                    transports: ['websocket', 'polling'],
                    reconnection: true,
                    reconnectionAttempts: 10,
                    reconnectionDelay: 1000,
                });

                socket.on('connect', () => {
                    appendLog('✅ Connected to server');
                });

                socket.on('connect_error', (err) => {
                    appendLog(`❌ Connection error: ${err.message}`);
                    setStatus('Error', false);
                });

                socket.on('disconnect', () => {
                    appendLog('🔌 Disconnected from server');
                    setStatus('Disconnected', false);
                    socket = null;
                    updateUsers([], null);
                });

            } catch (err) {
                appendLog(`❌ Error: ${err.message}`);
            }
        }

        // ---- Host a channel ----
        hostBtn.addEventListener('click', function() {
            if (!socket) connectSocket();

            const channelName = hostRoomInput.value.trim() || 'campfire';
            room = channelName;

            appendLog(`👑 Hosting channel: ${channelName}...`);

            socket.emit('hostChannel', channelName, deviceId, (response) => {
                if (response && response.success) {
                    appendLog(`✅ Channel "${channelName}" created!`);
                    setStatus(`Hosting "${channelName}"`, true, 'host');
                    hostChannelDisplay.style.display = 'block';
                    channelIdDisplay.textContent = channelName;
                    appendLog(`📢 Share this channel ID: ${channelName}`);
                    setupChannelListeners();
                } else {
                    appendLog(`❌ ${response.error || 'Failed to host channel'}`);
                    appendLog('💡 Try a different channel name.');
                }
            });
        });

        // ---- Join a channel ----
        joinBtn.addEventListener('click', function() {
            if (!socket) connectSocket();

            const channelName = joinRoomInput.value.trim();
            if (!channelName) {
                appendLog('⚠️ Please enter a channel ID to join.');
                return;
            }

            room = channelName;
            appendLog(`🔗 Joining channel: ${channelName}...`);

            socket.emit('joinChannel', channelName, deviceId, (response) => {
                if (response && response.success) {
                    appendLog(`✅ Joined channel "${channelName}"`);
                    setStatus(`In "${channelName}"`, true, 'joiner');
                    appendLog(`👑 Host: ${response.host}`);
                    if (response.users) {
                        updateUsers(response.users, response.host);
                    }
                    setupChannelListeners();
                } else {
                    appendLog(`❌ ${response.error || 'Failed to join channel'}`);
                    appendLog('💡 Make sure the channel exists and the ID is correct.');
                }
            });
        });

        // ---- Setup channel event listeners ----
        function setupChannelListeners() {
            socket.on('userJoined', (data) => {
                appendLog(`👤 ${data.userId} joined the channel`);
                updateUsers(data.users, data.hostId);
            });

            socket.on('userLeft', (data) => {
                appendLog(`👋 ${data.userId} left the channel`);
                updateUsers(data.users, data.hostId);
            });

            socket.on('message', (data) => {
                const roleIcon = data.role === 'host' ? '👑' : '🔗';
                appendLog(`📩 ${roleIcon} ${data.sender}: ${data.text}`);
            });

            socket.on('voice', (data) => {
                const roleIcon = data.role === 'host' ? '👑' : '🔗';
                appendLog(`🎤 ${roleIcon} Voice from ${data.sender}`);
                playVoice(data.audio);
            });

            socket.on('channelDestroyed', (msg) => {
                appendLog(`💥 ${msg}`);
                appendLog('🔌 Channel closed by host.');
                setStatus('Channel closed', false);
                socket = null;
                updateUsers([], null);
            });
        }

        // ---- Send text ----
        sendBtn.addEventListener('click', function() {
            if (!socket || !isConnected) {
                appendLog('⚠️ Not connected to a channel.');
                return;
            }
            const text = msgInput.value.trim();
            if (!text) return;

            socket.emit('sendMessage', { text: text });
            appendLog(`📤 You: ${text}`);
            msgInput.value = '';
        });

        msgInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });

        // ---- Voice recording ----
        async function startRecording() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 16000,
                        channelCount: 1
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(mediaStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.fftSize);

                mediaRecorder = new MediaRecorder(mediaStream, {
                    mimeType: 'audio/webm;codecs=opus'
                });

                voiceChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        voiceChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    if (voiceChunks.length > 0) {
                        const blob = new Blob(voiceChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = () => {
                            const base64 = reader.result;
                            if (socket && isConnected) {
                                socket.emit('sendVoice', { audio: base64 });
                                appendLog(`🎤 Voice sent (${blob.size} bytes)`);
                            }
                        };
                        reader.readAsDataURL(blob);
                    }
                    voiceChunks = [];
                };

                mediaRecorder.start(100);

                isRecording = true;
                voiceBtn.textContent = '🔴 Release to Send';
                voiceBtn.className = 'danger';
                statusBadge.textContent = '● recording';
                statusBadge.className = 'badge recording';

                updateLevel();

            } catch (err) {
                appendLog(`❌ Microphone error: ${err.message}`);
                appendLog('💡 Make sure you have a microphone and granted permission.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }

            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            isRecording = false;
            voiceBtn.textContent = '🎤 Hold to Talk';
            voiceBtn.className = 'success';
            voiceLevel.style.width = '0%';
            if (isConnected) {
                statusBadge.textContent = '● connected';
                statusBadge.className = 'badge on';
            }
        }

        function updateLevel() {
            if (!analyser || !isRecording) return;

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const avg = sum / dataArray.length;
            const percent = Math.min((avg / 128) * 100, 100);
            voiceLevel.style.width = percent + '%';

            animationFrame = requestAnimationFrame(updateLevel);
        }

        // ---- Voice button events ----
        voiceBtn.addEventListener('mousedown', async (e) => {
            e.preventDefault();
            if (!isRecording && isConnected) {
                await startRecording();
            }
        });

        voiceBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });

        voiceBtn.addEventListener('mouseleave', (e) => {
            if (isRecording) {
                stopRecording();
            }
        });

        voiceBtn.addEventListener('touchstart', async (e) => {
            e.preventDefault();
            if (!isRecording && isConnected) {
                await startRecording();
            }
        });

        voiceBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });

        voiceBtn.addEventListener('touchcancel', (e) => {
            if (isRecording) {
                stopRecording();
            }
        });

        // ---- Play voice ----
        function playVoice(base64Data) {
            try {
                const audio = new Audio(base64Data);
                audio.play().catch(err => {
                    appendLog(`⚠️ Could not play voice: ${err.message}`);
                });
            } catch (err) {
                appendLog(`⚠️ Could not play voice: ${err.message}`);
            }
        }

        // ---- Mode switching ----
        modeButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                modeButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const mode = this.dataset.mode;
                if (mode === 'host') {
                    hostMode.style.display = 'block';
                    joinMode.style.display = 'none';
                } else {
                    hostMode.style.display = 'none';
                    joinMode.style.display = 'block';
                }

                // If connected, disconnect first
                if (isConnected) {
                    appendLog('⚠️ Switch mode first by leaving the channel.');
                }
            });
        });

        // ---- Init ----
        appendLog('📡 VokiToki starting...');
        appendLog(`📱 Your device ID: ${deviceId}`);
        appendLog('💡 Choose "Host" to create a channel, or "Join" to connect to one.');
        appendLog('👑 Host: Create a channel and share the ID.');
        appendLog('🔗 Join: Enter a channel ID to connect.');

        // Connect socket immediately
        connectSocket();

        // ---- Handle page close ----
        window.addEventListener('beforeunload', function() {
            if (socket) {
                socket.disconnect();
            }
            if (isRecording) {
                stopRecording();
            }
        });

    })();
</script>
</body>
</html>
