<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>VokiToki – Voice Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            max-width: 500px;
            margin: 2rem auto;
            padding: 1.5rem;
        }
        .card {
            background: #1a1f2a;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid #2e3748;
            margin-bottom: 1.2rem;
        }
        h1 { font-size: 1.8rem; margin-bottom: 0.2rem; }
        .sub { color: #8892a8; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin: 0.5rem 0; }
        input {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            border: 1px solid #2e3748;
            background: #0f141e;
            color: #e8edf5;
            font-size: 1rem;
            min-width: 120px;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 2rem;
            font-weight: 600;
            background: #2a3348;
            color: #c8d0e0;
            cursor: pointer;
            border: 1px solid #3a445a;
            transition: 0.15s;
        }
        button:active { transform: scale(0.96); }
        button.primary { background: #2563eb; color: #fff; border-color: #3b82f6; }
        button.danger { background: #7f1d1d; border-color: #b91c1c; color: #fca5a5; }
        button.success { background: #16a34a; color: #fff; border-color: #22c55e; }
        button:disabled { opacity: 0.4; pointer-events: none; }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: #1e2a3a;
            color: #94a3b8;
        }
        .badge.on { background: #1e3a3a; color: #34d399; }
        .badge.recording { background: #7f1d1d; color: #fca5a5; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #log {
            background: #0f141e;
            padding: 0.8rem;
            border-radius: 1rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #1e2638;
            margin-top: 0.5rem;
        }
        hr { border: 0; border-top: 1px solid #1e2638; margin: 0.8rem 0; }
        .ip-box {
            background: #0f141e;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            font-family: monospace;
            font-size: 1.2rem;
            border: 1px solid #2563eb;
            display: inline-block;
            margin: 0.5rem 0;
        }
        .hint { color: #8892a8; font-size: 0.85rem; margin: 0.3rem 0; }
        .voice-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }
        .voice-indicator .bar {
            flex: 1;
            height: 4px;
            background: #1e2638;
            border-radius: 2px;
            overflow: hidden;
        }
        .voice-indicator .bar .fill {
            height: 100%;
            background: #22c55e;
            width: 0%;
            transition: width 0.1s;
        }
        .peer-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin: 0.5rem 0;
        }
        .peer-tag {
            background: #1e2a3a;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            color: #94a3b8;
            border: 1px solid #2a3348;
        }
        .peer-tag.active { border-color: #22c55e; color: #86efac; }
    </style>
</head>
<body>

<h1>📡 VokiToki Voice</h1>
<div class="sub">Push-to-talk • Works on same Wi-Fi</div>

<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span><span class="badge" id="statusBadge">⏸ idle</span></span>
        <span id="deviceName" style="color:#8892a8; font-size:0.85rem;"></span>
    </div>

    <div style="margin: 0.8rem 0;">
        <div class="hint">📱 Your IP:</div>
        <div class="ip-box" id="ipDisplay">Loading...</div>
        <div class="hint" style="margin-top:0.3rem;">
            Open on other device: <span id="urlDisplay" style="color:#60a5fa; word-break:break-all;"></span>
        </div>
    </div>

    <div class="peer-list" id="peerList">
        <span style="color:#4a5568; font-size:0.8rem;">No peers connected</span>
    </div>

    <hr />

    <!-- Text Chat -->
    <div class="row">
        <input id="msgInput" placeholder="Type a message..." maxlength="140" />
        <button class="primary" id="sendBtn">Send</button>
    </div>

    <!-- Voice Controls -->
    <div class="voice-indicator">
        <button class="success" id="voiceBtn" style="flex:1; padding:0.8rem; font-size:1.1rem;">
            🎤 Hold to Talk
        </button>
    </div>
    <div class="voice-indicator">
        <span style="font-size:0.75rem; color:#4a5568;">Voice level</span>
        <div class="bar">
            <div class="fill" id="voiceLevel"></div>
        </div>
    </div>

    <div id="log">💡 Open this page on another device on the same Wi-Fi.</div>
</div>

<script>
    (function() {
        'use strict';

        // ---- DOM refs ----
        const logEl = document.getElementById('log');
        const statusBadge = document.getElementById('statusBadge');
        const deviceName = document.getElementById('deviceName');
        const ipDisplay = document.getElementById('ipDisplay');
        const urlDisplay = document.getElementById('urlDisplay');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const voiceLevel = document.getElementById('voiceLevel');
        const peerList = document.getElementById('peerList');

        // ---- State ----
        let broadcastChannel = null;
        let isConnected = false;
        let isRecording = false;
        let audioContext = null;
        let mediaStream = null;
        let analyser = null;
        let dataArray = null;
        let animationFrame = null;
        let voiceChunks = [];
        let mediaRecorder = null;
        let peers = [];

        // ---- Get local IP ----
        function getLocalIP() {
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            pc.createDataChannel('ping');

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    const ip = event.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
                    if (ip) {
                        const localIP = ip[1];
                        ipDisplay.textContent = localIP;
                        const port = window.location.port || '8080';
                        const url = `http://${localIP}:${port}/vokitoki.html`;
                        urlDisplay.textContent = url;
                        pc.close();
                    }
                }
            };

            pc.createOffer()
                .then(offer => pc.setLocalDescription(offer))
                .catch(() => {
                    ipDisplay.textContent = 'Could not detect IP';
                });

            setTimeout(() => {
                if (ipDisplay.textContent === 'Loading...') {
                    const host = window.location.hostname;
                    if (host !== 'localhost' && host !== '127.0.0.1') {
                        ipDisplay.textContent = host;
                        const port = window.location.port || '8080';
                        urlDisplay.textContent = `http://${host}:${port}/vokitoki.html`;
                    }
                }
            }, 3000);
        }
        getLocalIP();

        // ---- Broadcast Channel ----
        function initBroadcast() {
            try {
                broadcastChannel = new BroadcastChannel('vokitoki-voice');

                broadcastChannel.onmessage = (event) => {
                    const data = event.data;
                    if (data.type === 'message') {
                        appendLog(`📩 ${data.sender || 'Other'}: ${data.text}`);
                    } else if (data.type === 'voice') {
                        appendLog(`🎤 Voice message from ${data.sender || 'Other'}`);
                        playVoice(data.audio);
                    } else if (data.type === 'peer') {
                        updatePeers(data.peers);
                    } else if (data.type === 'peerJoin') {
                        appendLog(`👤 ${data.peer} joined`);
                        updatePeers(data.peers);
                    } else if (data.type === 'peerLeave') {
                        appendLog(`👋 ${data.peer} left`);
                        updatePeers(data.peers);
                    }
                };

                isConnected = true;
                statusBadge.textContent = '● connected';
                statusBadge.className = 'badge on';
                deviceName.textContent = '📡 Voice channel ready';
                appendLog('✅ Voice channel active!');
                appendLog('💬 Hold the green button to talk.');
                appendLog('📱 Open this page on another device.');

                // Announce presence
                broadcastChannel.postMessage({
                    type: 'peerJoin',
                    peer: getDeviceId(),
                    peers: getDeviceId()
                });

            } catch (err) {
                appendLog(`⚠️ Broadcast channel error: ${err.message}`);
            }
        }

        // ---- Device ID ----
        function getDeviceId() {
            let id = localStorage.getItem('vokitoki_device_id');
            if (!id) {
                id = 'Device-' + Math.random().toString(36).substring(2, 7);
                localStorage.setItem('vokitoki_device_id', id);
            }
            return id;
        }

        // ---- Update peers ----
        function updatePeers(peerData) {
            if (typeof peerData === 'string') {
                peers = peerData.split(',');
            } else if (Array.isArray(peerData)) {
                peers = peerData;
            } else {
                // Try to parse
                try {
                    const parsed = JSON.parse(peerData);
                    if (Array.isArray(parsed)) peers = parsed;
                } catch (e) {}
            }

            const currentId = getDeviceId();
            const filtered = peers.filter(p => p !== currentId);

            if (filtered.length === 0) {
                peerList.innerHTML = '<span style="color:#4a5568; font-size:0.8rem;">No other devices connected</span>';
            } else {
                peerList.innerHTML = filtered.map(p =>
                    `<span class="peer-tag active">📱 ${p}</span>`
                ).join('');
            }
        }

        // ---- Append log ----
        function appendLog(msg) {
            const ts = new Date().toLocaleTimeString();
            logEl.textContent += `[${ts}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // ---- Send text message ----
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !broadcastChannel) return;

            broadcastChannel.postMessage({
                type: 'message',
                text: text,
                sender: getDeviceId()
            });
            appendLog(`📤 You: ${text}`);
            msgInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ---- Voice Recording ----
        async function startRecording() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 16000,
                        channelCount: 1
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(mediaStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.fftSize);

                // Start recording
                mediaRecorder = new MediaRecorder(mediaStream, {
                    mimeType: 'audio/webm;codecs=opus'
                });

                voiceChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        voiceChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    if (voiceChunks.length > 0) {
                        const blob = new Blob(voiceChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = () => {
                            const base64 = reader.result;
                            // Send voice
                            if (broadcastChannel) {
                                broadcastChannel.postMessage({
                                    type: 'voice',
                                    audio: base64,
                                    sender: getDeviceId()
                                });
                                appendLog(`🎤 Voice sent (${blob.size} bytes)`);
                            }
                        };
                        reader.readAsDataURL(blob);
                    }
                    voiceChunks = [];
                };

                mediaRecorder.start(100);

                isRecording = true;
                voiceBtn.textContent = '🔴 Release to Send';
                voiceBtn.className = 'danger';
                statusBadge.textContent = '● recording';
                statusBadge.className = 'badge recording';

                // Start level meter
                updateLevel();

            } catch (err) {
                appendLog(`❌ Microphone error: ${err.message}`);
                appendLog('💡 Make sure you have a microphone and granted permission.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }

            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            isRecording = false;
            voiceBtn.textContent = '🎤 Hold to Talk';
            voiceBtn.className = 'success';
            voiceLevel.style.width = '0%';
            statusBadge.textContent = '● connected';
            statusBadge.className = 'badge on';
        }

        function updateLevel() {
            if (!analyser || !isRecording) return;

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const avg = sum / dataArray.length;
            const percent = Math.min((avg / 128) * 100, 100);
            voiceLevel.style.width = percent + '%';

            animationFrame = requestAnimationFrame(updateLevel);
        }

        // ---- Voice button ----
        voiceBtn.addEventListener('mousedown', async (e) => {
            e.preventDefault();
            if (!isRecording) {
                await startRecording();
            }
        });

        voiceBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });

        voiceBtn.addEventListener('mouseleave', (e) => {
            if (isRecording) {
                stopRecording();
            }
        });

        // Touch events for mobile
        voiceBtn.addEventListener('touchstart', async (e) => {
            e.preventDefault();
            if (!isRecording) {
                await startRecording();
            }
        });

        voiceBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });

        voiceBtn.addEventListener('touchcancel', (e) => {
            if (isRecording) {
                stopRecording();
            }
        });

        // ---- Play voice ----
        function playVoice(base64Data) {
            try {
                const audio = new Audio(base64Data);
                audio.play().catch(err => {
                    appendLog(`⚠️ Could not play voice: ${err.message}`);
                });
            } catch (err) {
                appendLog(`⚠️ Could not play voice: ${err.message}`);
            }
        }

        // ---- Init ----
        appendLog('📡 VokiToki Voice starting...');
        appendLog('📱 Your device ID: ' + getDeviceId());
        appendLog('💡 Open this URL on another device.');
        appendLog('🎤 Hold the green button to talk.');

        setTimeout(initBroadcast, 1000);

        // ---- Handle page close ----
        window.addEventListener('beforeunload', function() {
            if (broadcastChannel) {
                broadcastChannel.postMessage({
                    type: 'peerLeave',
                    peer: getDeviceId()
                });
                broadcastChannel.close();
            }
            if (isRecording) {
                stopRecording();
            }
        });

        // ---- Reconnect on focus ----
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !broadcastChannel) {
                appendLog('🔄 Reconnecting...');
                setTimeout(initBroadcast, 500);
            }
        });

    })();
</script>
</body>
</html>
